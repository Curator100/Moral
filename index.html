<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium Tuition Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;
    --surface:#fffdf9;
    --ink:#1d1b17;
    --muted:#7a7467;
    --line:#e8e2d4;
    --accent:#86672b;
    --accent-soft:#f0e8d4;
    --accent-ink:#5f4817;
    --danger:#a2452f;
    --serif:'Cormorant Garamond','Noto Sans Bengali',Georgia,serif;
    --sans:'Manrope','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button,input{font:inherit;color:inherit}
  .hidden{display:none !important}

  /* ---------- Brand block ---------- */
  .brand{text-align:center}
  .brand h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(34px,6vw,54px);
    letter-spacing:.01em;
    line-height:1.05;
  }
  .brand p{
    margin-top:10px;
    font-size:13px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .rule{
    width:44px;height:1px;background:var(--accent);
    margin:20px auto 0;opacity:.7;
  }

  /* ---------- Login ---------- */
  #login{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;
  }
  .login-card{
    width:100%;max-width:380px;margin-top:40px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 26px 26px;
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 18px 40px -24px rgba(60,45,10,.28);
  }
  .field{display:block;margin-bottom:16px}
  .field span{
    display:block;font-size:11px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    margin-bottom:7px;
  }
  .field input{
    width:100%;padding:12px 14px;
    background:#fbf9f3;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(134,103,43,.14)}
  .btn{
    width:100%;padding:13px 16px;
    background:var(--ink);color:#f6f3ec;
    border:0;border-radius:10px;
    font-weight:600;font-size:14px;letter-spacing:.04em;
    cursor:pointer;transition:background .15s, transform .05s;
  }
  .btn:hover{background:#34302a}
  .btn:active{transform:translateY(1px)}
  #loginErr{
    min-height:18px;margin:-4px 0 12px;
    font-size:13px;color:var(--danger);
  }

  /* ---------- App shell ---------- */
  #app{max-width:980px;margin:0 auto;padding:0 20px 80px}
  .topbar{
    display:flex;justify-content:flex-end;align-items:center;gap:14px;
    padding:18px 0 0;font-size:13px;color:var(--muted);
  }
  .linkbtn{
    background:none;border:0;cursor:pointer;
    font-size:13px;color:var(--muted);
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);
  }
  .linkbtn:hover{color:var(--ink);text-decoration-color:var(--accent)}
  header.brand{padding:34px 0 36px}

  .tabs{
    display:flex;gap:6px;justify-content:center;
    padding:5px;margin:0 auto 28px;width:fit-content;max-width:100%;
    background:#efe9db;border-radius:999px;
  }
  .tab{
    border:0;background:transparent;cursor:pointer;
    padding:10px 22px;border-radius:999px;
    font-size:14px;font-weight:600;color:var(--muted);
    display:flex;align-items:center;gap:9px;
    transition:background .15s,color .15s,box-shadow .15s;
  }
  .tab .count{
    font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:999px;
    background:rgba(0,0,0,.06);color:var(--muted);
  }
  .tab[aria-selected="true"]{
    background:var(--surface);color:var(--ink);
    box-shadow:0 1px 2px rgba(60,45,10,.12),0 6px 14px -8px rgba(60,45,10,.25);
  }
  .tab[aria-selected="true"] .count{background:var(--accent-soft);color:var(--accent-ink)}

  .meta{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;font-size:12px;color:var(--muted);letter-spacing:.04em;
  }

  /* ---------- Cards ---------- */
  .list{display:grid;gap:14px}
  .card{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    transition:box-shadow .2s, transform .2s, border-color .2s;
  }
  .card:hover{
    border-color:#dccfb0;
    box-shadow:0 14px 30px -22px rgba(60,45,10,.45);
    transform:translateY(-1px);
  }
  .rail{
    flex:0 0 46px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);
    border-right:1px solid var(--line);
    color:var(--accent-ink);
  }
  .rail span{
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-size:11px;font-weight:700;letter-spacing:.32em;
  }
  .body{flex:1;min-width:0;padding:18px 22px 18px}
  .head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  }
  .loc{
    font-family:var(--serif);
    font-size:22px;font-weight:600;line-height:1.2;
    overflow-wrap:anywhere;
  }
  .loc.dim{color:var(--muted);font-style:italic;font-weight:500}
  .salary{
    text-align:right;flex:0 0 auto;
  }
  .salary b{
    display:block;
    font-family:var(--serif);
    font-size:26px;font-weight:700;line-height:1.1;
    color:var(--accent-ink);
    white-space:nowrap;
  }
  .salary b.neg{font-size:20px;font-weight:600;font-style:italic;color:var(--muted)}
  .salary small{
    display:block;margin-top:2px;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  }
  .facts{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:14px 22px;
    margin-top:16px;padding-top:14px;
    border-top:1px solid var(--line);
  }
  .fact dt{
    font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    margin-bottom:3px;
  }
  .fact dd{font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
  .posted{
    margin-top:14px;font-size:11.5px;color:var(--muted);letter-spacing:.03em;
  }

  .more{
    display:block;margin:24px auto 0;
    padding:11px 26px;
    background:transparent;border:1px solid var(--line);border-radius:999px;
    font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .more:hover{border-color:var(--accent);background:var(--surface)}

  .state{
    text-align:center;padding:70px 20px;color:var(--muted);font-size:14px;
  }
  .state .btn{width:auto;display:inline-block;margin-top:16px;padding:10px 22px}
  .skeleton{
    height:132px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(100deg,#f3efe4 30%,#faf7ef 50%,#f3efe4 70%);
    background-size:200% 100%;animation:sh 1.3s linear infinite;
  }
  @keyframes sh{to{background-position:-200% 0}}

  @media (max-width:560px){
    #app{padding:0 14px 60px}
    .rail{flex-basis:36px}
    .body{padding:15px 16px}
    .head{flex-direction:column;gap:8px}
    .salary{text-align:left}
    .loc{font-size:20px}
    .tab{padding:9px 16px}
    .facts{grid-template-columns:repeat(2,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<!-- Login -->
<section id="login">
  <div class="brand">
    <h1>Premium Tuition Media</h1>
    <p>Only the best tuitions, nothing else.</p>
    <div class="rule"></div>
  </div>
  <form class="login-card" id="loginForm" autocomplete="off">
    <label class="field"><span>Name</span><input id="u" type="text" autocapitalize="off" spellcheck="false" required></label>
    <label class="field"><span>Password</span><input id="p" type="password" required></label>
    <div id="loginErr" role="alert"></div>
    <button class="btn" type="submit">Enter</button>
  </form>
</section>

<!-- App -->
<main id="app" class="hidden">
  <div class="topbar">
    <span id="updated"></span>
    <button class="linkbtn" id="refresh" type="button">Refresh</button>
    <button class="linkbtn" id="logout" type="button">Sign out</button>
  </div>

  <header class="brand">
    <h1>Premium Tuition Media</h1>
    <p>Only the best tuitions, nothing else.</p>
    <div class="rule"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab71" aria-selected="true" data-k="t71">Tuition71 <span class="count" id="c71">–</span></button>
    <button class="tab" role="tab" id="tabbd" aria-selected="false" data-k="bd">BDTuition <span class="count" id="cbd">–</span></button>
  </div>

  <div class="meta"><span id="metaL">Newest first</span><span></span></div>
  <div id="list" class="list"></div>
  <button id="more" class="more hidden" type="button">Show more</button>
</main>

<script>
(function(){
  'use strict';

  /* ---- config ---- */
  var SB  = 'https://egsklbezrommbtyjyvak.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnc2tsYmV6cm9tbWJ0eWp5dmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MzA1NDYsImV4cCI6MjA5OTEwNjU0Nn0.g2r1gWeBg4RXQTsikure9wQJTXC0aNUw2p2V99-cZl4';
  var CRED = { u:'taha100', p:'123456' };
  var PAGE = 30;

  /* ---- tiny helpers ---- */
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function store(get,k,v){
    try{ if(get) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }
    catch(e){ return null; }
  }
  var BN='০১২৩৪৫৬৭৮৯';
  function latin(s){ return String(s).replace(/[০-৯]/g,function(d){ return BN.indexOf(d); }); }

  /* ---- formatting ---- */
  function fmtClass(raw){
    if(raw==null) return null;
    var s=String(raw).trim(); if(!s) return null;
    var l=latin(s);
    return /^\d{1,2}$/.test(l) ? 'Class '+l : s;
  }
  function fmtSalary(raw){
    if(raw==null || raw==='') return {t:'Negotiable',neg:true};
    var s=latin(raw).trim();
    if(/nego|আলোচনা/i.test(String(raw))) return {t:'Negotiable',neg:true};
    var n=null, m;
    if((m=s.match(/^(\d+(?:\.\d+)?)\s*k$/i))) n=Math.round(parseFloat(m[1])*1000);
    else if(/^[\d,]+$/.test(s)) n=parseInt(s.replace(/,/g,''),10);
    if(n===0) return {t:'Negotiable',neg:true};
    if(n) return {t:'৳'+n.toLocaleString('en-US')};
    return {t:(/^\d/.test(s)?'৳':'')+s};
  }
  function fmtMedium(raw){
    if(!raw) return null;
    var map={bangla_medium:'Bangla Medium',english_medium:'English Medium',english_version:'English Version'};
    if(map[raw]) return map[raw];
    return String(raw).replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
  }
  function fmtHours(raw){
    if(raw==null || raw==='') return null;
    var n=parseFloat(raw); if(isNaN(n)||n<=0) return null;
    return n+(n===1?' hr':' hrs');
  }
  function ago(iso){
    var t=new Date(iso).getTime(); if(isNaN(t)) return '';
    var m=Math.max(0,Math.round((Date.now()-t)/60000));
    if(m<1) return 'Just now';
    if(m<60) return m+' min ago';
    var h=Math.round(m/60); if(h<24) return h+(h===1?' hour':' hours')+' ago';
    var d=Math.round(h/24); if(d<30) return d+(d===1?' day':' days')+' ago';
    return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }

  /* ---- data ---- */
  function api(path){
    return fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
  }
  function load71(){
    return api('tm_tuitions_public?select=code,location,salary,class,days,time_slot,required_hours_per_session,medium,created_at'
      +'&t71_source_code=not.is.null&order=created_at.desc&limit=1000');
  }
  function loadBD(){
    return api('tm_bdt_tuitions_public?select=id,class_name,location,salary,created_at&order=created_at.desc&limit=1000');
  }

  var data={t71:[],bd:[]}, shown={t71:PAGE,bd:PAGE}, current='t71', loaded=false;

  /* ---- render ---- */
  function fact(label,val){
    return '<div class="fact"><dt>'+esc(label)+'</dt><dd>'+esc(val)+'</dd></div>';
  }
  function card71(r){
    var sal=fmtSalary(r.salary);
    var f='';
    var c=fmtClass(r['class']); if(c) f+=fact('Class',c);
    if(r.days) f+=fact('Days',r.days);
    if(r.time_slot) f+=fact('Time',r.time_slot);
    var h=fmtHours(r.required_hours_per_session); if(h) f+=fact('Hours',h);
    var md=fmtMedium(r.medium); if(md) f+=fact('Medium',md);
    return '<article class="card"><div class="rail"><span>CTG</span></div><div class="body">'
      +'<div class="head"><h3 class="loc'+(r.location?'':' dim')+'">'+esc(r.location||'Location on request')+'</h3>'
      +'<div class="salary"><b class="'+(sal.neg?'neg':'')+'">'+esc(sal.t)+'</b>'+(sal.neg?'':'<small>per month</small>')+'</div></div>'
      +(f?'<dl class="facts">'+f+'</dl>':'')
      +'<div class="posted">Posted '+esc(ago(r.created_at))+'</div></div></article>';
  }
  function cardBD(r){
    var sal=fmtSalary(r.salary);
    var f='';
    var c=fmtClass(r.class_name); if(c) f+=fact('Class',c);
    return '<article class="card"><div class="rail"><span>BD</span></div><div class="body">'
      +'<div class="head"><h3 class="loc'+(r.location?'':' dim')+'">'+esc(r.location||'Location on request')+'</h3>'
      +'<div class="salary"><b class="'+(sal.neg?'neg':'')+'">'+esc(sal.t)+'</b>'+(sal.neg?'':'<small>per month</small>')+'</div></div>'
      +(f?'<dl class="facts">'+f+'</dl>':'')
      +'<div class="posted">Posted '+esc(ago(r.created_at))+'</div></div></article>';
  }
  function render(){
    var rows=data[current], list=$('list'), more=$('more');
    $('c71').textContent=data.t71.length; $('cbd').textContent=data.bd.length;
    if(!loaded){
      list.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      more.classList.add('hidden'); return;
    }
    if(!rows.length){
      list.innerHTML='<div class="state">Nothing listed right now. Please check back soon.</div>';
      more.classList.add('hidden'); return;
    }
    var n=shown[current], fn=current==='t71'?card71:cardBD;
    list.innerHTML=rows.slice(0,n).map(fn).join('');
    more.classList.toggle('hidden', n>=rows.length);
  }
  function fail(){
    $('list').innerHTML='<div class="state">Couldn’t load tuitions.<br><button class="btn" id="retry" type="button">Try again</button></div>';
    $('more').classList.add('hidden');
    $('retry').onclick=refresh;
  }

  function refresh(){
    return Promise.all([load71(),loadBD()]).then(function(res){
      data.t71=res[0]; data.bd=res[1]; loaded=true;
      $('updated').textContent='Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      render();
    }).catch(function(){ if(!loaded) fail(); });
  }

  /* ---- tabs ---- */
  function setTab(k){
    current=k;
    $('tab71').setAttribute('aria-selected',k==='t71');
    $('tabbd').setAttribute('aria-selected',k==='bd');
    render();
  }
  $('tab71').onclick=function(){ setTab('t71'); };
  $('tabbd').onclick=function(){ setTab('bd'); };
  $('more').onclick=function(){ shown[current]+=PAGE; render(); };
  $('refresh').onclick=refresh;

  /* ---- auth ---- */
  var timer=null;
  function enter(){
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    render(); refresh();
    clearInterval(timer);
    timer=setInterval(function(){ if(!document.hidden) refresh(); },120000);
  }
  function leave(){
    store(false,'tm_auth',null);
    clearInterval(timer);
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('p').value='';
  }
  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    if($('u').value.trim()===CRED.u && $('p').value===CRED.p){
      $('loginErr').textContent='';
      store(false,'tm_auth','1');
      enter();
    }else{
      $('loginErr').textContent='That name or password isn’t right.';
    }
  });
  $('logout').onclick=leave;

  if(store(true,'tm_auth')==='1') enter();
})();
</script>
</body>
</html>
